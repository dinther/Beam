appId: com.beatline.beam
productName: Beatline Beam
directories:
  buildResources:  public
  # Keep packaging output out of `dist`, which is where `npm run build` puts
  # the Vite web build. Sharing that folder is what leaves a locked
  # `dist/win-unpacked` behind when a packaging run is interrupted.
  output: release
# The demo profiles and structures the app seeds into a new user's library.
# Unpacked beside the app rather than inside the asar: the main process reads
# them as ordinary files, and anyone who goes looking finds them as ordinary
# files too.
extraResources:
  - from: resources/library
    to: library
    filter:
      - '**/*'
files:
  - './out/**/*'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# asarUnpack:
#   - resources/**
win:
  executableName: Beam
# Double-clicking a project opens it here. The extension is ours; the icon is
# the application's, since a project has no separate identity to show.
fileAssociations:
  - ext: beam
    name: Beatline Beam Project
    description: Beatline Beam project
    icon: public/icon.ico
    role: Editor
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # An assisted install rather than one click. One click has no pages at all --
  # just a progress window -- so there is nowhere to choose a folder and nowhere
  # to put the artwork. The pages cost a few clicks and buy both.
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Not forced either way: the install-mode page offers both, and this decides
  # which arrives selected. All users is the default, so the suggested folder is
  # Program Files rather than a folder inside AppData that nobody browses to.
  # Choosing it asks for an administrator, which is what writing there costs;
  # anyone who would rather not can drop to a per-user install on the same page.
  perMachine: false
  selectPerMachineByDefault: true
  # installerHeader.bmp, installerSidebar.bmp and uninstallerSidebar.bmp are
  # picked up by name from buildResources, which is `public`.
  runAfterFinish: true
  # The blockmap exists so an updater can download only the changed parts of a
  # new installer. With no update channel there is nothing to serve it.
  differentialPackage: false
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  icon: public/icon.icns
dmg:
  artifactName: ${name}-${version}.${ext}
  icon: public/icon.icns
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
  icon: public/icon.ico
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# No update channel. Nothing in the app checks for updates -- electron-updater
# is not even a dependency -- and left unset the build still writes a manifest
# and a differential blockmap describing a channel that does not exist.
publish: null
