appId: com.beatline.beam
productName: Beatline Beam
directories:
  buildResources:  public
  # Keep packaging output out of `dist`, which is where `npm run build` puts
  # the Vite web build. Sharing that folder is what leaves a locked
  # `dist/win-unpacked` behind when a packaging run is interrupted.
  output: release
files:
  - './out/**/*'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# asarUnpack:
#   - resources/**
win:
  executableName: Beam
# Double-clicking a project opens it here. The extension is ours; the icon is
# the application's, since a project has no separate identity to show.
fileAssociations:
  - ext: beam
    name: Beatline Beam Project
    description: Beatline Beam project
    icon: public/icon.ico
    role: Editor
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  icon: public/icon.icns
dmg:
  artifactName: ${name}-${version}.${ext}
  icon: public/icon.icns
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
  icon: public/icon.ico
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
